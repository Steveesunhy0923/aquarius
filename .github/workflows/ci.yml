name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One run per ref at a time. On main this is what keeps two quick pushes from
# deploying out of order — an older build finishing last would overwrite the
# newer one. A queued run is replaced by the next push, so the latest commit
# always wins. PR runs are only checks, so a newer push just cancels them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # `@atorku/auth` and `@atorku/entitlements` are linked from a SIBLING
      # checkout ("file:../atorku/packages/*" in package.json), so CI has to
      # reproduce the ~/atorku + ~/aquarius layout. Without it `npm ci` resolves
      # the links to nothing and typecheck dies with TS2307 "Cannot find module
      # '@atorku/auth'" — which is exactly how this workflow broke at 0.8.0.
      - uses: actions/checkout@v4
        with:
          path: aquarius

      # Fail here, loudly, rather than letting the checkout below do it. The
      # default GITHUB_TOKEN is scoped to THIS repository, and GitHub answers
      # 404 (not 403) for a private repo a token cannot see — so without this
      # step the whole failure reads "Not Found - .../rest/repos/repos", which
      # looks like the repo does not exist rather than a missing credential.
      - name: Require the atorku read token
        env:
          TOKEN: ${{ secrets.ATORKU_REPO_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::ATORKU_REPO_TOKEN is not set. Aquarius depends on \
          @atorku/auth and @atorku/entitlements via file:../atorku/packages/*, so CI \
          must check out the private Steveesunhy0923/atorku repo beside this one. \
          Create a fine-grained PAT scoped to that repo with Contents: Read-only, and \
          add it as the ATORKU_REPO_TOKEN repository secret. If atorku is ever made \
          public, delete this step and the token: line below. If the packages are \
          published to npm, delete the whole sibling-checkout arrangement."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          repository: Steveesunhy0923/atorku
          path: atorku
          token: ${{ secrets.ATORKU_REPO_TOKEN }}

      # 22, not the 20 in .nvmrc: the atorku workspace declares `node >= 22`.
      # Aquarius's own engines field is `>= 20`, so one runtime satisfies both.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: aquarius/package-lock.json

      # Both packages ship compiled dist/ rather than source, and dist/ is
      # gitignored — so it must be built here or the link points at an empty
      # directory and the failure looks identical to the one above.
      - name: Build shared packages
        working-directory: atorku
        run: npm install && npm run build:packages

      - name: Install
        working-directory: aquarius
        run: npm ci

      - name: Typecheck
        working-directory: aquarius
        run: npm run typecheck

      - name: Test
        working-directory: aquarius
        run: npm test

      - name: Build
        working-directory: aquarius
        run: npm run build

      # ── Deploy: pushes to main only, and only once everything above passed ──
      #
      # This lives here rather than in Cloudflare's Git integration (Workers
      # Builds) because that clones a single repository, and the file:../atorku
      # links need the sibling checkout this job already does.
      #
      # NEXT_PUBLIC_* are inlined into the bundle at build time. A build without
      # them still succeeds and deploys an app that silently cannot sign in or
      # sync, so a missing value stops the deploy instead of degrading it.
      - name: Require deploy configuration
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          missing=""
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Not deploying — missing:$missing. CLOUDFLARE_API_TOKEN is a \
          repository secret (Cloudflare dashboard → My Profile → API Tokens → \"Edit \
          Cloudflare Workers\" template, zone atorku.com). The rest are repository \
          variables; the NEXT_PUBLIC_* values are the ones in .env.local."
            exit 1
          fi

      # build:static, not build: it parks app/api and exports to out/, which is
      # the directory wrangler.jsonc serves.
      - name: Build static export
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: aquarius
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          # Optional, unlike the two above: error reporting is off when this
          # repository variable is unset (lib/monitoring.ts), so it is not in
          # the "Require deploy configuration" list. A DSN is not a secret —
          # it ships in the bundle — hence vars, not secrets.
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
        run: npm run build:static

      - name: Deploy to aquarius.atorku.com
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: aquarius
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.131.2 deploy
