name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # `@atorku/auth` and `@atorku/entitlements` are linked from a SIBLING
      # checkout ("file:../atorku/packages/*" in package.json), so CI has to
      # reproduce the ~/atorku + ~/aquarius layout. Without it `npm ci` resolves
      # the links to nothing and typecheck dies with TS2307 "Cannot find module
      # '@atorku/auth'" — which is exactly how this workflow broke at 0.8.0.
      - uses: actions/checkout@v4
        with:
          path: aquarius

      # Fail here, loudly, rather than letting the checkout below do it. The
      # default GITHUB_TOKEN is scoped to THIS repository, and GitHub answers
      # 404 (not 403) for a private repo a token cannot see — so without this
      # step the whole failure reads "Not Found - .../rest/repos/repos", which
      # looks like the repo does not exist rather than a missing credential.
      - name: Require the atorku read token
        env:
          TOKEN: ${{ secrets.ATORKU_REPO_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::ATORKU_REPO_TOKEN is not set. Aquarius depends on \
          @atorku/auth and @atorku/entitlements via file:../atorku/packages/*, so CI \
          must check out the private Steveesunhy0923/atorku repo beside this one. \
          Create a fine-grained PAT scoped to that repo with Contents: Read-only, and \
          add it as the ATORKU_REPO_TOKEN repository secret. If atorku is ever made \
          public, delete this step and the token: line below. If the packages are \
          published to npm, delete the whole sibling-checkout arrangement."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          repository: Steveesunhy0923/atorku
          path: atorku
          token: ${{ secrets.ATORKU_REPO_TOKEN }}

      # 22, not the 20 in .nvmrc: the atorku workspace declares `node >= 22`.
      # Aquarius's own engines field is `>= 20`, so one runtime satisfies both.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: aquarius/package-lock.json

      # Both packages ship compiled dist/ rather than source, and dist/ is
      # gitignored — so it must be built here or the link points at an empty
      # directory and the failure looks identical to the one above.
      - name: Build shared packages
        working-directory: atorku
        run: npm install && npm run build:packages

      - name: Install
        working-directory: aquarius
        run: npm ci

      - name: Typecheck
        working-directory: aquarius
        run: npm run typecheck

      - name: Test
        working-directory: aquarius
        run: npm test

      - name: Build
        working-directory: aquarius
        run: npm run build
