<!doctype html><html><head><meta charset="utf-8">
<title>Aquarius — Share & Auth dialogs (redesigned)</title>
<style>
:root{
  --background:#fbfbfd; --foreground:#17171c; --surface:#ffffff;
  --border:#ebebf0; --border-soft:#f2f2f6; --accent:#5b5bd6; --accent-soft:#eeeefb;
  --muted:#8a8a93; --faint:#b9b9c2;
}
.dark{
  --background:#0e0e12; --foreground:#ededf2; --surface:#17171d;
  --border:#2a2a35; --border-soft:#20202a; --accent:#818cf8; --accent-soft:#23233a;
  --muted:#9ca3af; --faint:#6b7280;
}
*{box-sizing:border-box}
body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.stage{display:flex;gap:30px;align-items:flex-start;justify-content:center;padding:46px 40px;background:var(--background)}
.ic{display:inline-grid;place-items:center;vertical-align:middle;color:inherit}
.ic svg :is(path,circle,rect,line,polyline,polygon){fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ic svg [style*="fill:currentColor"]{fill:currentColor}
/* dialog shell */
.dlg{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:0 24px 60px rgba(18,18,40,.22);overflow:hidden;color:var(--foreground)}
.dh{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border-soft)}
.dh h2{font-size:16px;font-weight:600;margin:0}
.xbtn{display:grid;place-items:center;width:32px;height:32px;border-radius:6px;color:var(--muted)}
.dc{padding:16px 20px}
.sec{margin:20px 0 10px;font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
/* share */
.share{width:440px}
.addrow{display:flex;align-items:center;gap:8px}
.field{display:flex;align-items:center;gap:6px;flex:1;min-width:0;border:1px solid var(--border);border-radius:6px;background:var(--background);padding:0 10px}
.field .at{color:var(--muted);font-size:14px}
.field input{flex:1;min-width:0;border:0;background:transparent;outline:none;padding:9px 0;font-size:14px;color:var(--foreground)}
.sel{position:relative}
.sel select,.selbox{appearance:none;border:1px solid var(--border);border-radius:6px;background:var(--surface);padding:8px 30px 8px 12px;font-size:14px;color:var(--foreground)}
.sel .chev{position:absolute;right:8px;top:50%;transform:translateY(-50%);color:var(--muted)}
.btn-accent{border:0;border-radius:6px;background:var(--accent);color:#fff;font-weight:540;font-size:14px;padding:9px 16px}
.people{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.prow{display:flex;align-items:center;gap:12px}
.av{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;color:#fff;font-weight:600;font-size:14px;flex-shrink:0}
.pmeta{min-width:0;flex:1}
.pmeta .u{font-size:14px;font-weight:540}
.pmeta .e{font-size:12px;color:var(--muted)}
.owner{font-size:14px;color:var(--muted)}
.rm{display:grid;place-items:center;width:32px;height:32px;border-radius:6px;color:var(--muted)}
/* auth */
.auth{width:360px}
.gbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:14px;font-weight:540;color:var(--foreground);background:transparent}
.divider{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12px;margin:16px 0}
.divider span{height:1px;flex:1;background:var(--border)}
.inp{width:100%;border:1px solid var(--border);border-radius:8px;background:var(--background);padding:10px 12px;font-size:14px;color:var(--foreground);outline:none;margin-bottom:12px}
.inp::placeholder{color:var(--muted)}
.submit{width:100%;border:0;border-radius:8px;background:var(--accent);color:#fff;font-weight:540;font-size:14px;padding:10px 12px}
.foot{display:flex;align-items:center;justify-content:space-between;margin-top:16px;font-size:12px;color:var(--muted)}
.foot a{color:var(--muted);text-decoration:none}
</style></head>
<body>
<div class="stage" id="stage">

  <!-- SHARE -->
  <div class="dlg share">
    <div class="dh"><h2>Share document</h2><span class="xbtn" data-ic="close"></span></div>
    <div class="dc">
      <div class="addrow">
        <div class="field"><span class="at">@</span><input placeholder="username" value=""></div>
        <div class="sel"><span class="selbox">Editor</span><span class="chev ic" data-ic="chevron"></span></div>
        <button class="btn-accent">Share</button>
      </div>
      <div class="sec">People with access</div>
      <ul class="people">
        <li class="prow">
          <span class="av" style="background:#5b5bd6">S</span>
          <span class="pmeta"><div class="u">@steveesunhy</div><div class="e">stevesunhy@gmail.com</div></span>
          <span class="owner">Owner</span>
        </li>
        <li class="prow">
          <span class="av" style="background:#3fb27f">E</span>
          <span class="pmeta"><div class="u">@emma</div><div class="e">Emma Watson</div></span>
          <span class="sel"><span class="selbox">Editor</span><span class="chev ic" data-ic="chevron"></span></span>
          <span class="rm" data-ic="close"></span>
        </li>
      </ul>
    </div>
  </div>

  <!-- AUTH -->
  <div class="dlg auth">
    <div class="dh"><h2>Sign in</h2><span class="xbtn" data-ic="close"></span></div>
    <div class="dc">
      <button class="gbtn"><span id="gmark"></span> Continue with Google</button>
      <div class="divider"><span></span>or<span></span></div>
      <input class="inp" placeholder="you@example.com">
      <input class="inp" type="password" placeholder="Password" value="········">
      <button class="submit">Sign in</button>
      <div class="foot"><a>Create an account</a><a>Forgot password?</a></div>
    </div>
  </div>

</div>
<script>
const I={
 close:'<line x1="7" y1="7" x2="17" y2="17"/><line x1="17" y1="7" x2="7" y2="17"/>',
 chevron:'<polyline points="6.5,10 12,15 17.5,10"/>',
};
const SZ={close:16,chevron:12};
document.querySelectorAll('[data-ic]').forEach(el=>{
  el.classList.add('ic');
  const n=el.dataset.ic; const s=el.classList.contains('chev')?12:(el.classList.contains('rm')?15:SZ[n]||16);
  el.innerHTML='<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24">'+(I[n]||'')+'</svg>';
});
document.getElementById('gmark').innerHTML='<svg width="16" height="16" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.1 29.5 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.3-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.1 29.5 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.5-5.2l-6.2-5.3C29.2 35.1 26.7 36 24 36c-5.3 0-9.7-3.1-11.3-7.6l-6.5 5C9.6 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.1-4 5.5l6.2 5.3C41.1 35.5 44 30.2 44 24c0-1.3-.1-2.3-.4-3.5z"/></svg>';
</script>
</body></html>
