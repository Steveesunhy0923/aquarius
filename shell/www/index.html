<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Aquarius</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, system-ui, sans-serif;
        background: #f6f6f4;
        color: #333;
      }
      main {
        max-width: 32rem;
        padding: 2rem;
        text-align: center;
        line-height: 1.5;
      }
      code {
        background: #ececea;
        padding: 0.1em 0.35em;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Aquarius native shell</h1>
      <p>
        Content is served from the dev server or a static export. If you can read
        this inside the app, the Capacitor <code>server.url</code> was not applied
        &mdash; run <code>npm run ios:sync</code> with the dev server on
        <code>http://localhost:3000</code> (or set <code>CAP_SERVER_URL</code> for a
        real device) and rebuild.
      </p>
    </main>
  </body>
</html>
